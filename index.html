<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0b2e">
  <meta name="color-scheme" content="dark">
  <title>Life in Weeks</title>
  <meta name="description" content="Your life in weeks — one dot per week. Everything you enter lives in the page address; bookmark it and it's saved.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a0b2e'/%3E%3Ccircle cx='9' cy='9' r='3' fill='%235b2fa3'/%3E%3Ccircle cx='16' cy='9' r='3' fill='%235b2fa3'/%3E%3Ccircle cx='23' cy='9' r='3' fill='%2330f0ff'/%3E%3Ccircle cx='9' cy='16' r='3' fill='%23ff4370'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff4370'/%3E%3Ccircle cx='23' cy='16' r='3' fill='%23ff4370'/%3E%3Ccircle cx='9' cy='23' r='3' fill='%23ff4370'/%3E%3Ccircle cx='16' cy='23' r='3' fill='%23ff4370'/%3E%3Ccircle cx='23' cy='23' r='3' fill='%23ff4370'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<main id="stage">
  <canvas id="grid" aria-label="Your life in weeks, one dot per week"></canvas>
  <footer id="bar">
    <p id="stats" aria-live="polite"></p>
    <ul id="legend"></ul>
  </footer>
</main>

<button id="fab" type="button" data-i18n-aria="openSettings" aria-label="Open settings" aria-haspopup="dialog" aria-controls="panel">
  <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/>
    <circle cx="16" cy="6" r="2" fill="currentColor"/>
    <circle cx="8" cy="12" r="2" fill="currentColor"/>
    <circle cx="18" cy="18" r="2" fill="currentColor"/>
  </svg>
</button>

<div id="tip" role="tooltip" hidden></div>

<div id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden>
  <div id="backdrop"></div>
  <section id="sheet">
    <header>
      <h1 id="panel-title" data-i18n="panelTitle">Your life in weeks</h1>
      <div id="lang" class="seg mini" role="radiogroup" data-i18n-aria="language" aria-label="Language">
        <label><input type="radio" name="lang" value="en"><span>EN</span></label>
        <label><input type="radio" name="lang" value="ru"><span>RU</span></label>
      </div>
      <button id="close" type="button" data-i18n-aria="closeSettings" aria-label="Close settings">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </header>

    <div class="field">
      <span class="label" data-i18n="birth">Date of birth</span>
      <div class="date-field" id="birth"></div>
    </div>
    <div class="field">
      <span class="label" data-i18n="lifespan">Expected lifespan</span>
      <span class="with-unit">
        <input type="number" id="years" min="1" max="150" step="1" inputmode="numeric" data-i18n-aria="lifespan" aria-label="Expected lifespan">
        <span class="unit" data-i18n="years">years</span>
      </span>
    </div>
    <p id="total-hint" class="hint"></p>

    <h2 data-i18n="periods">Periods</h2>
    <p class="hint" data-i18n="periodsHint"></p>
    <ul id="ranges" class="rows"></ul>
    <button id="add-range" type="button" class="secondary" data-i18n="addPeriod">+ Add period</button>

    <h2 data-i18n="dates">Dates</h2>
    <p class="hint" data-i18n="datesHint"></p>
    <ul id="events" class="rows"></ul>
    <button id="add-event" type="button" class="secondary" data-i18n="addDate">+ Add date</button>

    <h2 data-i18n="theme">Theme</h2>
    <div id="themes" role="radiogroup" data-i18n-aria="theme" aria-label="Theme"></div>

    <h2 data-i18n="connect">Connect dots</h2>
    <div id="water" class="seg" role="radiogroup" data-i18n-aria="connect" aria-label="Connect dots">
      <label><input type="radio" name="water" value="0" checked><span data-i18n="water0">Off</span></label>
      <label><input type="radio" name="water" value="1"><span data-i18n="water1">Scalloped</span></label>
      <label><input type="radio" name="water" value="2"><span data-i18n="water2">Straight</span></label>
      <label><input type="radio" name="water" value="3"><span data-i18n="water3">Filled</span></label>
    </div>

    <h2 data-i18n="saving">Saving</h2>
    <p class="hint" data-i18n-html="savingHint"></p>
    <div class="actions">
      <button id="copy" type="button" class="primary" data-i18n="copyLink">Copy link</button>
      <button id="export" type="button" class="primary" data-i18n="saveImage">Save image</button>
      <button id="reset" type="button" class="danger" data-i18n="reset">Reset everything</button>
    </div>
    <div id="colorpop" hidden>
      <div class="presets"></div>
    </div>

    <p class="hint credits" data-i18n-html="credits"></p>
  </section>
</div>

<template id="range-row">
  <li class="row">
    <div class="row-head">
      <button type="button" class="r-grip" data-i18n-aria="drag">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="9" cy="6" r="1.6" fill="currentColor"/><circle cx="15" cy="6" r="1.6" fill="currentColor"/>
          <circle cx="9" cy="12" r="1.6" fill="currentColor"/><circle cx="15" cy="12" r="1.6" fill="currentColor"/>
          <circle cx="9" cy="18" r="1.6" fill="currentColor"/><circle cx="15" cy="18" r="1.6" fill="currentColor"/>
        </svg>
      </button>
      <button type="button" class="r-color" data-i18n-aria="colour" aria-haspopup="true"></button>
      <input type="text" class="r-label" maxlength="60" data-i18n-placeholder="labelPeriod">
      <button type="button" class="r-del" data-i18n-aria="deletePeriod">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5 7h14M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/>
        </svg>
      </button>
    </div>
    <div class="row-dates">
      <span class="label" data-i18n="from">From</span>
      <div class="date-field r-start"></div>
    </div>
    <div class="row-dates">
      <span class="label" data-i18n="to">To</span>
      <div class="date-field r-end"></div>
      <label class="ongoing"><input type="checkbox" class="r-ongoing"> <span data-i18n="ongoing">Ongoing</span></label>
    </div>
  </li>
</template>

<template id="event-row">
  <li class="row">
    <div class="row-head">
      <button type="button" class="r-grip" data-i18n-aria="drag">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="9" cy="6" r="1.6" fill="currentColor"/><circle cx="15" cy="6" r="1.6" fill="currentColor"/>
          <circle cx="9" cy="12" r="1.6" fill="currentColor"/><circle cx="15" cy="12" r="1.6" fill="currentColor"/>
          <circle cx="9" cy="18" r="1.6" fill="currentColor"/><circle cx="15" cy="18" r="1.6" fill="currentColor"/>
        </svg>
      </button>
      <button type="button" class="r-color" data-i18n-aria="colour" aria-haspopup="true"></button>
      <input type="text" class="r-label" maxlength="60" data-i18n-placeholder="labelDate">
      <button type="button" class="r-del" data-i18n-aria="deleteDate">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5 7h14M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/>
        </svg>
      </button>
    </div>
    <div class="row-dates">
      <span class="label" data-i18n="on">On</span>
      <div class="date-field r-date"></div>
    </div>
  </li>
</template>

<script type="module" src="./app.js"></script>
</body>
</html>
